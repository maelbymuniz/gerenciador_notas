<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>
</head>
<body>
    <h1>Alunos Ativos</h1>

    <ul>
        {% for aluno in alunos %}
            <li>{{ aluno.nome }}</li>
        {% empty %}
            <li>Nenhum aluno cadastrado</li>
        {% endfor %}
    </ul>
</body>
</html>
