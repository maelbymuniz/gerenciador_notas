<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>
</head>
<body>
    <h1>Alunos Ativos</h1>

    <ul>
        {% for aluno in alunos %}
            <li>{{ aluno.nome }} {{ aluno.turma}}
                - 
                <a href="{% url 'editar_aluno' aluno.id %}">Editar</a>
                |
                <a href="{% url 'inativar_aluno' aluno.id %}">Inativar</a>
            </li>
        {% empty %}
            <li>Nenhum aluno cadastrado</li>
        {% endfor %}
    </ul>

    <a href="{% url 'criar_aluno' %}">Novo aluno</a>

</body>
</html>
